<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seller</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Seller: create lots</h1>
  <div id="net"></div>
  <p>Connect the wallet that holds your BRC-20 <b>transfer inscriptions</b>. For each one, enter its coin and the price. Your wallet signs a lot; nothing is sent.</p>
  <div class="row"><button id="connect">Connect UniSat</button></div>
  <label for="coin">Inscription coin (txid:vout)</label>
  <input id="coin" placeholder="64-hex-txid:0" autocomplete="off">
  <label for="amt">Token amount in that transfer inscription</label>
  <input id="amt" inputmode="numeric" placeholder="1000">
  <label for="payto">Payout address (where buyers' payments go; leave empty to use the connected wallet). Public address only, never a key.</label>
  <input id="payto" placeholder="bc1p... or bc1q..." autocomplete="off">
  <label for="price">Price in sats (must cover buyer fees; see README)</label>
  <input id="price" inputmode="numeric" placeholder="20000">
  <div class="row"><button id="sign">Sign lot</button><button id="dl" class="ghost" disabled>Download signed-lots.jsonl</button></div>
  <div id="status"></div>
  <pre id="out"></pre>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
